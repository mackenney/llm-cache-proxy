[workspace]
members = [
    "crates/lcp-core",
    "crates/lcp-server",
    "crates/lcp",
    "tests",
]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
authors = ["Ignacio"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mackenney/llm-cache-proxy"
readme = "README.md"
publish = false

[profile.dev]
debug = 2

[profile.dev.package."*"]
debug = "line-tables-only"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP server
axum = { version = "0.8", features = ["http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "decompression-full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Hashing
blake3 = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
bytes = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"

# Internal crates
lcp-core = { path = "crates/lcp-core", version = "0.0.2" }
lcp-server = { path = "crates/lcp-server", version = "0.0.2" }
doppel = { version = "0.0.2", features = ["async"] }
hex = "0.4"

