schema = 1
provider = "openai"
scenario = "oai_chat_stream_error"
model = "gpt-4o-mini"
recorded_at = "2026-06-11"
secret_kind = "openai_classic"

[request]
method = "POST"
path = "/v1/chat/completions"
content_type = "application/json"
body = """
{
  "model": "gpt-4o-mini",
  "max_tokens": 50,
  "stream": true,
  "messages": [
    {
      "role": "invalid_role",
      "content": "hi"
    }
  ]
}
"""

[[response]]
status = 400

body_chunks = [
  "{\n  \"error\": {\n    \"message\": \"Invalid value: 'invalid_role'. Supported values are: 'system', 'assistant', 'user', 'function', 'tool', and 'developer'.\",\n    \"type\": \"invalid_request_error\",\n    \"param\": \"messages[0].role\",\n    \"code\": \"invalid_value\"\n  }\n}",
]
[response.headers]
content-type = "application/json"

